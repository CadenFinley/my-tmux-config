# Tmux configuration generated from tmux-bindings.md

# Prefix
set -g prefix C-s
set -g prefix2 None
unbind C-b
bind C-s send-prefix

# Config
bind e new-window "#{?env:EDITOR,#{env:EDITOR},vi} ~/.config/tmux/tmux.conf"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux config"

# Sessions
bind C-c new-session
bind C-f choose-tree -s
bind S-Tab switch-client -l

# Splits and panes
unbind %
bind - split-window -v
bind h split-window -h
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind < swap-pane -U
bind > swap-pane -D
bind + resize-pane -Z
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Windows
set -g base-index 1
set -g pane-base-index 1
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1
bind -r C-S-L swap-window -t +1
bind Tab last-window

# Copy mode
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Buffers
bind b list-buffers
bind p paste-buffer
bind P choose-buffer

# Mouse
set -g mouse on
# Drag window tabs across the status line to reorder them.
bind -n MouseDown1Status select-window -t = \; set -F @drag_window '#{window_id}'
bind -n MouseDrag1Status if -F '#{@drag_window}' { run -C 'swap-window -d -s #{@drag_window} -t =' }
bind -n MouseDragEnd1Status set -u @drag_window
# Ignore scrolling over the status line to avoid accidental window changes.
unbind -n WheelUpStatus
unbind -n WheelDownStatus
bind m if -F '#{mouse}' 'set -g mouse off; display-message "Mouse: off"' 'set -g mouse on; display-message "Mouse: on"'

# Misc
bind -n C-l send-keys C-l \; clear-history
bind F run-shell "pathpicker"

# Custom non-binding settings
set -g status-position bottom
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -ga terminal-overrides ",xterm-256color:Tc"

# Pane borders
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour39
set -g pane-border-lines heavy
set -g pane-border-indicators off
# Show a bright ACTIVE tag only on the focused pane in split windows.
set -g pane-border-status off
set -g pane-border-format "#{?#{&&:#{pane_active},#{>:#{window_panes},1}},#[fg=colour234#,bg=colour39#,bold] ACTIVE #[default],}"
# Add or remove the entire border row as panes are split or closed.
set-hook -g window-layout-changed[100] 'set -wF pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
# Update existing windows when this configuration is reloaded.
run-shell -C '#{S:#{W:set -w -t #{window_id} pane-border-status #{?#{>:#{window_panes},1},top,off};}}'

# Status bar
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 50
set -g status-right-length 100
set -g status-left "#[fg=colour234,bg=colour40,bold] #S #[default]"
set -g status-right "#[fg=colour250]#(whoami)@#H "
setw -g window-status-style "fg=colour245"
setw -g window-status-last-style "fg=colour234,bg=colour220,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour39,bold] #I:#W #[default]"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
